<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FYnance - VisionOS</title>
    <!-- Cache Busting for Futuristic Design -->
    <link rel="stylesheet" href="/static/css/style.css?v=vision_os_4">
    <link rel="stylesheet" href="/static/css/color-bends.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Using Inter/Outfit is fine, but system font 'SF Pro' is targeted via CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <!-- DEBUG: Global Error Handler -->
    <script>
        window.onerror = function (message, source, lineno, colno, error) {
            const errDiv = document.createElement('div');
            errDiv.style.position = 'fixed';
            errDiv.style.top = '0';
            errDiv.style.left = '0';
            errDiv.style.width = '100%';
            errDiv.style.background = 'rgba(255, 0, 0, 0.9)';
            errDiv.style.color = 'white';
            errDiv.style.padding = '20px';
            errDiv.style.zIndex = '99999';
            errDiv.style.fontFamily = 'monospace';
            errDiv.innerHTML = `<h3>CRITICAL ERROR</h3><p>${message}</p><p>${source}:${lineno}:${colno}</p><pre>${error?.stack || ''}</pre>`;
            document.body.appendChild(errDiv);
        };
        window.addEventListener('unhandledrejection', function (event) {
            const errDiv = document.createElement('div');
            errDiv.style.position = 'fixed';
            errDiv.style.top = '50%';
            errDiv.style.left = '0';
            errDiv.style.width = '100%';
            errDiv.style.background = 'rgba(255, 100, 0, 0.9)';
            errDiv.style.color = 'white';
            errDiv.style.padding = '20px';
            errDiv.style.zIndex = '99999';
            errDiv.style.fontFamily = 'monospace';
            errDiv.innerHTML = `<h3>UNHANDLED PROMISE</h3><p>${event.reason}</p>`;
            document.body.appendChild(errDiv);
        });
    </script>
    <!-- Premium 3D Background -->
    <div id="color-bends-canvas" class="color-bends-container fixed-bg"></div>

    <!-- Static Dimming Overlay -->
    <div class="global-overlay"></div>
    <!-- Glass Overlay -->
    <div id="app" class="app-container">
        <!-- Floating Glass Nav -->
        <nav class="glass-nav hidden" id="navbar">
            <div class="nav-content">
                <a href="#dashboard" class="brand-logo">
                    <span class="logo-text">FYNANCE</span>
                </a>
                <div class="nav-items">
                    <a href="#dashboard" class="nav-item" data-page="dashboard">
                        <i data-lucide="layout-dashboard"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="#spending" class="nav-item" data-page="spending">
                        <i data-lucide="wallet"></i>
                        <span>Spending</span>
                    </a>
                    <a href="#goals" class="nav-item" data-page="goals">
                        <i data-lucide="target"></i>
                        <span>Goals</span>
                    </a>
                    <a href="#subscriptions" class="nav-item" data-page="subscriptions">
                        <i data-lucide="credit-card"></i>
                        <span>Subs</span>
                    </a>
                    <a href="#mood" class="nav-item" data-page="mood">
                        <i data-lucide="smile"></i>
                        <span>Mood</span>
                    </a>
                    <a href="#ai" class="nav-item" data-page="ai">
                        <i data-lucide="bot"></i>
                        <span>AI</span>
                    </a>
                    <a href="#profile" class="nav-item" data-page="profile">
                        <i data-lucide="user"></i>
                        <span>Profile</span>
                    </a>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main id="main-content" class="glass-viewport">
            <!-- Dynamic Content -->
        </main>
    </div>

    <script src="/static/js/app.js?v=19" type="module"></script>
</body>

</html>
